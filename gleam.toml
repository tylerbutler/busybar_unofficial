name = "busybar_unofficial"
version = "0.1.0"
description = "Unofficial Gleam client for the BUSY Bar HTTP API"
licences = ["MIT"]
repository = { type = "github", user = "tylerbutler", repo = "busybar_unofficial" }
target = "erlang"
gleam = ">= 1.11.0"

internal_modules = [
  "busybar_unofficial/internal",
  "busybar_unofficial/internal/*",
]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
